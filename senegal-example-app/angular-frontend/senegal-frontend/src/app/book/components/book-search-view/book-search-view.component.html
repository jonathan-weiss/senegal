<mat-card>
  <mat-card-header><mat-card-title>Books</mat-card-title></mat-card-header>
  <mat-card-content>

  <book-table-view
  [allBooks]="allBooks"
  (selectEntryClicked)="select($event)"
  (editEntryClicked)="edit($event)"
  (deleteEntryClicked)="delete($event)"
  [highlightedBook]="highlightedBook"
  [showDeleteButton]="showDeleteButton"
  [showEditButton]="showEditButton"
  [showSelectButton]="showSelectButton"
  [isLocked]="isLocked"
  [stackKey]="stackKey"
></book-table-view>
  </mat-card-content>
  <mat-card-actions>
    @if(showCancelButton) {
      <button mat-raised-button color="secondary" (click)="cancel()">Cancel</button>
    }
    @if(showAddButton) {
      <button mat-raised-button color="primary" [disabled]="isLocked" (click)="add()">Add new Book...</button>
    }
  </mat-card-actions>
</mat-card>
