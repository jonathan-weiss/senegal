@if(!checked) {
  <button matSuffix mat-icon-button (click)="unconfirmedClicked()" [disabled]="disabled">
    <mat-icon>delete</mat-icon>
  </button>
} @else {
  <button matSuffix mat-icon-button (click)="cancelClicked()" [disabled]="disabled">
    <mat-icon>cancel</mat-icon>
  </button>
  <button matSuffix mat-icon-button (click)="confirmedClicked()" [disabled]="disabled">
    <mat-icon class="warning-color">delete</mat-icon>
  </button>
}
