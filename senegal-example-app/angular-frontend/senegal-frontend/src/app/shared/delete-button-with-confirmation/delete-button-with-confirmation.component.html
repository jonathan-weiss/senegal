@if(checked) {
  <button matSuffix mat-icon-button (click)="cancelClicked()" [disabled]="disabled">
    <mat-icon>cancel</mat-icon>
  </button>
}
<button matSuffix mat-icon-button (click)="deleteClicked()" [disabled]="disabled">
  <mat-icon [class.warning-color]="checked">delete</mat-icon>
</button>
