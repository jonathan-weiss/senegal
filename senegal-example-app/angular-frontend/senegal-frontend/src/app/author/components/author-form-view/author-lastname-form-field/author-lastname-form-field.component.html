<mat-form-field appearance="fill">
  <mat-label>Lastname</mat-label>
  <input matInput type="text" [formControl]="authorLastnameFormControl" [disableFormControl]="isLocked">
@if(authorLastnameFormControl.hasError('required')) {
  <mat-error>Lastname is <strong>required</strong></mat-error>
}
</mat-form-field>
