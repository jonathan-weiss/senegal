<table mat-table [dataSource]="allAuthor" class="mat-elevation-z0">

  <ng-container matColumnDef="choiceColumn">
    <th mat-header-cell *matHeaderCellDef class="context-column-small-size"></th>
    <td mat-cell *matCellDef="let element" class="context-column-color context-column-small-size">
      <button matSuffix mat-icon-button (click)="chooseClicked(element)" [disabled]="isLocked">
        <mat-icon>check</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="selection">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox [disabled]="isLocked" [checked]="isSelectedAll" (change)="selectAllClicked($event.checked)"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox [disabled]="isLocked" [checked]="isSelected(element)" (change)="selectedClicked(element, $event.checked)"></mat-checkbox>
      </td>
  </ng-container>

  <ng-container matColumnDef="authorId">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element" (click)="onRowClicked(asAuthor(element))" (dblclick)="onRowDoubleClicked(asAuthor(element))">
        {{asAuthor(element).authorId.value}}
      </td>
  </ng-container>


  <ng-container matColumnDef="firstname">
      <th mat-header-cell *matHeaderCellDef> firstname </th>
      <td mat-cell *matCellDef="let element" (click)="onRowClicked(asAuthor(element))" (dblclick)="onRowDoubleClicked(asAuthor(element))">
        {{ asAuthor(element).firstname }}
      </td>
  </ng-container>
  <ng-container matColumnDef="lastname">
      <th mat-header-cell *matHeaderCellDef> lastname </th>
      <td mat-cell *matCellDef="let element" (click)="onRowClicked(asAuthor(element))" (dblclick)="onRowDoubleClicked(asAuthor(element))">
        {{ asAuthor(element).lastname }}
      </td>
  </ng-container>

  <ng-container matColumnDef="editColumn">
    <th mat-header-cell *matHeaderCellDef class="context-column-small-size"></th>
    <td mat-cell *matCellDef="let element" class="context-column-color context-column-small-size">
      <button matSuffix mat-icon-button (click)="editClicked(element)" [disabled]="isLocked">
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="deleteColumn">
    <th mat-header-cell *matHeaderCellDef class="context-column-large-size">
      <delete-button-with-confirmation (clickedWithConfirmation)="deleteAllSelectedClicked()" [disabled]="isLocked"></delete-button-with-confirmation>
    </th>
    <td mat-cell *matCellDef="let element" class="context-column-color context-column-large-size">
      <delete-button-with-confirmation (clickedWithConfirmation)="deleteClicked(element)" [disabled]="isLocked"></delete-button-with-confirmation>
    </td>
  </ng-container>

  <ng-container matColumnDef="tableMenuColumn">
    <th mat-header-cell *matHeaderCellDef class="table-context-column-size">
      <button mat-icon-button (click)="openColumnSelectionDialog()" [disabled]="isLocked">
        <mat-icon>more_vert</mat-icon>
      </button>
    </th>
    <td mat-cell *matCellDef="let element" class="table-context-column-size"></td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.highlighted-row]="isHighlighted(row)"></tr>
</table>
