<table mat-table [dataSource]="allAuthorDataSource" class="mat-elevation-z0" matSort>

  <ng-container matColumnDef="choiceColumn">
    <th mat-header-cell *matHeaderCellDef class="context-column-small-size"></th>
    <td mat-cell *matCellDef="let element" class="action-column-color context-column-small-size">
      <button matSuffix mat-icon-button (click)="chooseClicked(element)" [disabled]="isLocked">
        <mat-icon>check</mat-icon>
      </button>
    </td>
  </ng-container>

  <ng-container matColumnDef="selection">
      <th mat-header-cell *matHeaderCellDef class="selection-column-size">
        <mat-checkbox [disabled]="isLocked" [checked]="isSelectedAll" (change)="selectAllClicked($event.checked)"></mat-checkbox>
        <delete-button-with-confirmation class="selection-column-button-alignment" (clickedWithConfirmation)="deleteAllSelectedClicked()" [disabled]="isLocked"></delete-button-with-confirmation>
      </th>
      <td mat-cell *matCellDef="let element" class="selection-column-size">
        <mat-checkbox [disabled]="isLocked" [checked]="isSelected(element)" (change)="selectedClicked(element, $event.checked)"></mat-checkbox>
      </td>
  </ng-container>

  <ng-container matColumnDef="authorId">
      <th mat-header-cell *matHeaderCellDef  mat-sort-header> No. </th>
      <td mat-cell *matCellDef="let element" (click)="onRowClicked(asAuthor(element))" (dblclick)="onRowDoubleClicked(asAuthor(element))">
        {{asAuthor(element).authorId.value}}
      </td>
  </ng-container>


  <ng-container matColumnDef="firstname">
      <th mat-header-cell *matHeaderCellDef  mat-sort-header> firstname </th>
      <td mat-cell *matCellDef="let element" (click)="onRowClicked(asAuthor(element))" (dblclick)="onRowDoubleClicked(asAuthor(element))">
        {{ asAuthor(element).firstname }}
      </td>
  </ng-container>
  <ng-container matColumnDef="lastname">
      <th mat-header-cell *matHeaderCellDef  mat-sort-header> lastname </th>
      <td mat-cell *matCellDef="let element" (click)="onRowClicked(asAuthor(element))" (dblclick)="onRowDoubleClicked(asAuthor(element))">
        {{ asAuthor(element).lastname }}
      </td>
  </ng-container>

  <ng-container matColumnDef="actionColumn">
    <th mat-header-cell *matHeaderCellDef class="action-column-size action-column-color action-column-header-text-alignment">
      <button mat-icon-button (click)="openColumnSelectionDialog()" [disabled]="isLocked">
        <mat-icon>more_vert</mat-icon>
      </button>
    </th>
    <td mat-cell *matCellDef="let element" class="action-column-size action-column-color">
      @if(this.showEditButton) {
        <button matSuffix mat-icon-button (click)="editClicked(element)" [disabled]="isLocked">
          <mat-icon>edit</mat-icon>
        </button>
      }
      @if(this.showDeleteButton) {
        <delete-button-with-confirmation (clickedWithConfirmation)="deleteClicked(element)" [disabled]="isLocked"></delete-button-with-confirmation>
      }

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.highlighted-row]="isHighlighted(row)" focusable-item></tr>
</table>
<mat-paginator [pageSizeOptions]="[25, 50, 100, 500]" [pageSize]="100" aria-label="Select page of authors"></mat-paginator>
