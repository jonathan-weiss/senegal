<table mat-table [dataSource]="allCountry" class="mat-elevation-z0">

    <ng-container matColumnDef="countryId">
        <th mat-header-cell *matHeaderCellDef> No. </th>
        <td mat-cell *matCellDef="let element"> {{asCountry(element).countryId.value}} </td>
    </ng-container>


    <ng-container matColumnDef="countryName">
        <th mat-header-cell *matHeaderCellDef> countryName </th>
        <td mat-cell *matCellDef="let element"> {{ asCountry(element).countryName }} </td>
    </ng-container>

    <ng-container matColumnDef="context">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element" class="context-column">

        <button matSuffix mat-icon-button (click)="selectClicked(element)" [disabled]="isLocked">
          <mat-icon>check</mat-icon>
        </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="onRowDoubleClicked(row)"
        [class.highlighted-row]="isHighlighted(row)"></tr>
</table>
